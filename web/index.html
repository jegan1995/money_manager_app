<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Money Manager — Personal Finance App">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Money Manager">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Money Manager</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0D1117;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* ── Splash screen ─────────────────────────────────── */
    #splash {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0D1117 0%, #1a1f2e 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Logo circle */
    .logo-ring {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px rgba(102, 126, 234, 0.5);
      animation: pulse 2s ease-in-out infinite;
      margin-bottom: 28px;
    }

    .logo-ring span {
      font-size: 44px;
      line-height: 1;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(102,126,234,0.4); }
      50%       { transform: scale(1.05); box-shadow: 0 0 60px rgba(102,126,234,0.7); }
    }

    /* App name */
    .app-name {
      color: #fff;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .app-sub {
      color: rgba(255,255,255,0.45);
      font-size: 13px;
      margin-bottom: 52px;
    }

    /* Progress bar */
    .progress-track {
      width: 200px;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      border-radius: 2px;
      animation: load 3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes load {
      0%   { width: 0%; }
      30%  { width: 40%; }
      60%  { width: 70%; }
      85%  { width: 88%; }
      100% { width: 95%; }
    }

    .loading-text {
      color: rgba(255,255,255,0.35);
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      animation: blink 1.5s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.35; }
      50%       { opacity: 0.7; }
    }

    /* Dots animation */
    .dots {
      display: flex;
      gap: 8px;
      margin-top: 40px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(102, 126, 234, 0.6);
      animation: bounce 1.4s ease-in-out infinite;
    }
    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%            { transform: scale(1);   opacity: 1; }
    }

    /* Flutter canvas — hidden until ready */
    flt-glass-pane {
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    flt-glass-pane.ready {
      opacity: 1;
    }
  </style>
</head>

<body>
  <!-- Splash screen shown while Flutter loads -->
  <div id="splash">
    <div class="logo-ring">
      <span>💰</span>
    </div>
    <div class="app-name">Money Manager</div>
    <div class="app-sub">Personal Finance · Smart Insights</div>
    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>
    <div class="loading-text">Loading</div>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      // Flutter is ready — fade out splash
      const splash = document.getElementById('splash');
      splash.classList.add('hidden');

      // Show Flutter canvas
      const canvas = document.querySelector('flt-glass-pane');
      if (canvas) canvas.classList.add('ready');

      // Remove splash from DOM after fade
      setTimeout(() => splash.remove(), 700);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
